services:
  kanban-app:
    build: .
    container_name: easy-kanban
    ports:
      - "3010:3010"
      - "3222:3222"
    environment:
      - NODE_ENV=production
      - DOCKER_ENV=true
      - PORT=3222
      - VITE_API_URL=http://localhost:3222
      - REDIS_URL=redis://redis:6379
      # Database configuration - PostgreSQL (required)
      - DB_TYPE=postgresql
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kanban
      - POSTGRES_USER=kanban_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kanban_password}
      # JWT / settings encryption (from project-root .env — Compose substitutes ${VAR})
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY:-}
      # Allowed origins for CORS
      - ALLOWED_ORIGINS=localhost,127.0.0.1,kanban.drenlia.dev,admin.agila.dev
      # Enable demo mode to show countdown timer for hourly resets (demo environments only)
      - DEMO_ENABLED=false
      # License settings (BASIC PLAN)
      - LICENSE_ENABLED=true
      - USER_LIMIT=5
      - TASK_LIMIT=100
      - BOARD_LIMIT=10
      - STORAGE_LIMIT=1073741824
      - SUPPORT_TYPE=basic
      # Instance configuration for admin portal access
      - INSTANCE_NAME=basic-instance
      - INSTANCE_TOKEN=${INSTANCE_TOKEN:-kanban-basic-token-12345}
      - ADMIN_SERVICE_URL=https://admin.agila.dev
      # Multi-tenant configuration (set to false for single-tenant Docker deployments)
      - MULTI_TENANT=false
      # Tenant domain (only used in multi-tenant mode, for extracting tenant ID from hostname)
      # Example: If TENANT_DOMAIN=agila.dev, then customer1.agila.dev -> tenant ID: customer1
      - TENANT_DOMAIN=agila.dev
      # Managed SMTP seed for new licensed DBs (optional; falls back to smtp./noreply@ TENANT_DOMAIN)
      - MANAGED_SMTP_HOST=${MANAGED_SMTP_HOST:-}
      - MANAGED_SMTP_USERNAME=${MANAGED_SMTP_USERNAME:-}
      - MANAGED_SMTP_FROM_EMAIL=${MANAGED_SMTP_FROM_EMAIL:-}
      - MANAGED_SMTP_FROM_NAME=${MANAGED_SMTP_FROM_NAME:-}
      - MANAGED_SMTP_PASSWORD=${MANAGED_SMTP_PASSWORD:-}
      # Application version (optional, will override database value if set)
      - APP_VERSION=0.9-beta
    volumes:
      - .:/app
      - /app/node_modules
      - kanban-data:/app/server/data
      - kanban-attachments:/app/server/attachments
      - kanban-avatars:/app/server/avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: easy-kanban-postgres
    environment:
      - POSTGRES_DB=kanban
      - POSTGRES_USER=kanban_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kanban_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban_user -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: easy-kanban-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  kanban-data:
    driver: local
  kanban-attachments:
    driver: local
  kanban-avatars:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
