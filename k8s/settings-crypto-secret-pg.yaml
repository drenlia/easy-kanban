apiVersion: v1
kind: Secret
metadata:
  name: easy-kanban-settings-crypto
  namespace: easy-kanban-pg
  labels:
    app: easy-kanban
    database: postgresql
type: Opaque
stringData:
  # AES key material for admin settings at rest (SMTP / OAuth / AI secrets).
  # Prefer a dedicated value; if empty at deploy time the script may fall back
  # to JWT_SECRET from the ConfigMap until this Secret is populated.
  SETTINGS_ENCRYPTION_KEY: "SETTINGS_ENCRYPTION_KEY_PLACEHOLDER"
